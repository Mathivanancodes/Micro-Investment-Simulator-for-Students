# Application
spring.application.name=micro-investment-simulator

# Create the micro_investment schema before starting the application.
# Supply credentials through the environment; never commit passwords.
# SPRING_DATASOURCE_URL can override this URL for a trusted local or hosted database.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:micro_investment}?sslMode=VERIFY_IDENTITY&allowPublicKeyRetrieval=false&connectionTimeZone=UTC
spring.datasource.username=${DB_USER:simulator}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Development schema management; use versioned migrations for production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# HTTP and JSON
server.port=${PORT:8080}
server.servlet.context-path=/
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.accept-float-as-int=false

# Secrets are injected by the runtime or generated by scripts/dev.sh for local development.
app.jwt-secret=${JWT_SECRET}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.seed-demo=${SEED_DEMO:false}
app.demo-password=${DEMO_PASSWORD:}
app.price-strategy=${PRICE_STRATEGY:random}
app.prices.enabled=${PRICES_ENABLED:true}
app.prices.interval-ms=${PRICE_INTERVAL_MS:30000}
